<style>
  /* ── Reset & Tipografía ───────────────────────────────────── */
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --verde:      #10b981;
    --verde-dark: #059669;
    --naranja:    #f59e0b;
    --rojo:       #ef4444;
    --azul:       #1d4ed8;
    --azul-dark:  #0f2942;
    --gris-bg:    #f1f5f9;
    --gris-card:  #ffffff;
    --gris-borde: #e2e8f0;
    --texto:      #1e293b;
    --texto-muted:#64748b;
    --mapa-pin-bg: rgba(255, 255, 255, 0.98);
    --mapa-sidebar-bg: #f8fafc;
    --mapa-card-bg: #ffffff;
    --shadow:     0 2px 12px rgba(0,0,0,.08);
    --shadow-lg:  0 8px 32px rgba(0,0,0,.14);
    --radius:     12px;
    --radius-sm:  8px;
    --nav-h:      60px;
  }

  [data-theme="dark"] {
    --gris-bg:    #0b1329;
    --gris-card:  #1e293b;
    --gris-borde: #334155;
    --texto:      #f8fafc;
    --texto-muted:#94a3b8;
    --mapa-pin-bg: rgba(30, 41, 59, 0.95);
    --mapa-sidebar-bg: #0f172a;
    --mapa-card-bg: #1e293b;
    --shadow:     0 4px 16px rgba(0,0,0,.35);
    --shadow-lg:  0 8px 32px rgba(0,0,0,.5);
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--gris-bg);
    color: var(--texto);
    min-height: 100vh;
    padding-top: var(--nav-h);
  }

  /* ── Navbar ─────────────────────────────────────────────── */
  .nav-5s {
    position: fixed; top: 0; left: 0; right: 0; z-index: 999;
    height: var(--nav-h);
    background: var(--azul-dark);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
    box-shadow: 0 2px 16px rgba(0,0,0,.35);
  }
  .nav-brand {
    display: flex; align-items: center; gap: 10px;
    color: #fff; font-weight: 800; font-size: 17px; letter-spacing: .3px;
  }
  .nav-brand .badge-5s {
    background: var(--verde); color: #fff;
    font-size: 11px; font-weight: 700; padding: 2px 8px;
    border-radius: 20px; letter-spacing: .5px;
  }
  .nav-tabs-5s {
    display: flex; gap: 4px;
  }
  .nav-tab {
    padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer;
    font-size: 13px; font-weight: 600; font-family: 'Inter', sans-serif;
    color: rgba(255,255,255,.65);
    background: transparent; transition: all .2s;
    display: flex; align-items: center; gap: 6px;
  }
  .nav-tab:hover { background: rgba(255,255,255,.12); color: #fff; }
  .nav-tab.activo { background: var(--verde); color: #fff; }

  /* ── Layout contenedor ───────────────────────────────────── */
  .vista { display: none; }
  .vista.activa { display: block; }
  .contenedor { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }

  /* ── KPI Cards ───────────────────────────────────────────── */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .kpi-card {
    background: var(--gris-card); border: 1px solid var(--gris-borde);
    border-radius: var(--radius); padding: 18px 14px; text-align: center;
    box-shadow: var(--shadow); transition: transform .2s, box-shadow .2s;
  }
  .kpi-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .kpi-card .valor { font-size: 32px; font-weight: 800; line-height: 1; }
  .kpi-card .etiqueta { font-size: 11px; font-weight: 600; color: var(--texto-muted); text-transform: uppercase; margin-top: 6px; }

  /* ── Tarjeta genérica ────────────────────────────────────── */
  .card-5s {
    background: var(--gris-card); border: 1px solid var(--gris-borde);
    border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
  }
  .card-header {
    padding: 16px 20px; border-bottom: 1px solid var(--gris-borde);
    display: flex; align-items: center; justify-content: space-between;
  }
  .card-header h3 { font-size: 15px; font-weight: 700; }
  .card-header .muted { font-size: 12px; color: var(--texto-muted); }
  .card-body { padding: 20px; }

  /* ── Badges de estado ────────────────────────────────────── */
  .badge-estado {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
    letter-spacing: .4px; text-transform: uppercase;
  }
  .badge-progreso  { background: #fef3c7; color: #92400e; }
  .badge-retrasada { background: #fee2e2; color: #991b1b; }
  .badge-cerrada   { background: #f1f5f9; color: #475569; }

  /* ── Tabla Baúl ──────────────────────────────────────────── */
  .tabla-baul { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tabla-baul thead th {
    background: var(--azul-dark); color: #fff;
    padding: 10px 12px; text-align: left; font-size: 11px;
    font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
  }
  .tabla-baul tbody tr { border-bottom: 1px solid var(--gris-borde); transition: background .15s; }
  .tabla-baul tbody tr:hover { background: #f8fafc; }
  .tabla-baul tbody td { padding: 12px; vertical-align: middle; }
  .tabla-baul .territorio-tag {
    display: inline-block; background: #eff6ff; color: #1d4ed8;
    padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600;
  }

  /* ── Formulario de auditoría ─────────────────────────────── */
  .audit-header {
    background: linear-gradient(135deg, var(--azul-dark) 0%, #1a3a5c 100%);
    border-radius: var(--radius); padding: 24px; margin-bottom: 20px; color: #fff;
  }
  .audit-header h2 { font-size: 20px; font-weight: 800; }
  .audit-header p  { font-size: 13px; opacity: .75; margin-top: 4px; }

  .categoria-titulo {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; font-weight: 700; color: var(--azul-dark);
    background: #eff6ff; padding: 10px 16px; border-radius: var(--radius-sm);
    margin-bottom: 10px; border-left: 4px solid var(--azul);
    text-transform: uppercase; letter-spacing: .5px;
  }

  .pregunta-item {
    background: #fff; border: 1px solid var(--gris-borde);
    border-radius: var(--radius-sm); padding: 16px;
    margin-bottom: 10px; transition: border-color .2s;
  }
  .pregunta-item:has(.respuesta-no:checked) { border-color: var(--rojo); background: #fff8f8; }
  .pregunta-item:has(.respuesta-si:checked) { border-color: var(--verde); }

  .pregunta-texto { font-size: 14px; font-weight: 500; margin-bottom: 12px; line-height: 1.4; }

  .btn-respuesta-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-respuesta {
    flex: 1; min-width: 100px; padding: 10px;
    border: 2px solid var(--gris-borde); border-radius: var(--radius-sm);
    background: #fff; cursor: pointer; font-weight: 700; font-size: 14px;
    transition: all .2s; text-align: center;
  }
  .btn-respuesta.si:hover, input.respuesta-si:checked + .btn-respuesta.si {
    border-color: var(--verde); background: #ecfdf5; color: var(--verde-dark);
  }
  .btn-respuesta.no:hover, input.respuesta-no:checked + .btn-respuesta.no {
    border-color: var(--rojo); background: #fff1f2; color: #991b1b;
  }

  /* Ocultar radios nativos pero mantener funcionalidad */
  .respuesta-radio { display: none; }

  .hallazgo-box {
    margin-top: 10px; display: none;
    animation: fadeIn .2s ease;
  }
  .hallazgo-box.visible { display: block; }
  .hallazgo-box textarea {
    width: 100%; padding: 10px; border: 1px solid var(--gris-borde);
    border-radius: var(--radius-sm); font-family: 'Inter', sans-serif;
    font-size: 13px; resize: vertical; min-height: 60px;
  }
  .hallazgo-box textarea:focus { outline: none; border-color: var(--rojo); }

  /* ── Filtros ─────────────────────────────────────────────── */
  .filtros-bar {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end;
    background: #fff; border: 1px solid var(--gris-borde);
    border-radius: var(--radius); padding: 16px; margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .filtro-grupo { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 120px; }
  .filtro-grupo label { font-size: 10px; font-weight: 700; color: var(--texto-muted); text-transform: uppercase; }
  .filtro-grupo select,
  .filtro-grupo input { 
    padding: 8px 10px; border: 1px solid var(--gris-borde); border-radius: 8px;
    font-family: 'Inter', sans-serif; font-size: 13px; color: var(--texto);
    background: #fff;
  }
  .filtro-grupo select:focus,
  .filtro-grupo input:focus { outline: none; border-color: var(--azul); }

  /* ── Botones ─────────────────────────────────────────────── */
  .btn { 
    padding: 10px 20px; border-radius: var(--radius-sm); border: none; cursor: pointer;
    font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14px;
    display: inline-flex; align-items: center; gap: 8px; transition: all .2s;
  }
  .btn-verde   { background: var(--verde); color: #fff; }
  .btn-verde:hover { background: var(--verde-dark); }
  .btn-naranja { background: var(--naranja); color: #fff; }
  .btn-naranja:hover { background: #d97706; }
  .btn-azul    { background: var(--azul); color: #fff; }
  .btn-azul:hover { background: #1e3a8a; }
  .btn-ghost   { background: transparent; border: 1px solid var(--gris-borde); color: var(--texto-muted); }
  .btn-ghost:hover { background: var(--gris-bg); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn-sm { padding: 6px 14px; font-size: 12px; }
  .btn-icon { background: none; border: none; cursor: pointer; padding: 6px; color: var(--texto-muted); transition: color .2s; }
  .btn-icon:hover { color: var(--azul); }

  /* ── Formulario modal/vista ──────────────────────────────── */
  .form-5s { display: flex; flex-direction: column; gap: 16px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group label { font-size: 12px; font-weight: 700; color: var(--texto-muted); text-transform: uppercase; }
  .form-group input,
  .form-group select,
  .form-group textarea {
    padding: 10px 12px; border: 1px solid var(--gris-borde); border-radius: var(--radius-sm);
    font-family: 'Inter', sans-serif; font-size: 14px; color: var(--texto);
    background: #fff; transition: border-color .2s;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus { outline: none; border-color: var(--azul); box-shadow: 0 0 0 3px rgba(29,78,216,.12); }
  .form-group textarea { resize: vertical; min-height: 80px; }

  /* Panel cierre (igual al ETOS) */
  .panel-cierre {
    background: #eff6ff; border: 1px dashed var(--azul);
    border-radius: var(--radius-sm); padding: 16px;
  }
  .panel-cierre label { color: var(--azul); font-size: 13px; font-weight: 700; }
  .panel-cierre p { font-size: 12px; color: var(--texto-muted); margin-top: 4px; }

  /* ── Cargando spinner ────────────────────────────────────── */
  .cargando { text-align: center; padding: 40px; color: var(--texto-muted); }
  .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid var(--gris-borde);
    border-top-color: var(--azul); border-radius: 50%; animation: spin .7s linear infinite; }

  /* ── Toast de notificación ───────────────────────────────── */
  .toast-5s {
    position: fixed; bottom: 24px; right: 24px; z-index: 9999;
    background: var(--azul-dark); color: #fff;
    padding: 14px 20px; border-radius: var(--radius); box-shadow: var(--shadow-lg);
    font-size: 14px; font-weight: 600; transform: translateY(80px); opacity: 0;
    transition: all .35s cubic-bezier(.22,.61,.36,1);
    display: flex; align-items: center; gap: 10px;
  }
  .toast-5s.visible { transform: translateY(0); opacity: 1; }
  .toast-5s.exito   { background: var(--verde-dark); }
  .toast-5s.error   { background: #991b1b; }

  /* ── Volver ──────────────────────────────────────────────── */
  .barra-accion {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; flex-wrap: wrap; gap: 8px;
  }
  .barra-accion h2 { font-size: 18px; font-weight: 800; }

  /* ── Resumen de auditoría ────────────────────────────────── */
  .resumen-auditoria {
    background: linear-gradient(135deg, #ecfdf5, #d1fae5);
    border: 1px solid #6ee7b7; border-radius: var(--radius); padding: 20px;
    text-align: center; display: none;
  }
  .resumen-auditoria .pct { font-size: 48px; font-weight: 800; color: var(--verde-dark); }
  .resumen-auditoria p { color: var(--verde-dark); font-size: 14px; }
  .resumen-auditoria.rojo { background: linear-gradient(135deg, #fff1f2, #fee2e2); border-color: #fca5a5; }
  .resumen-auditoria.rojo .pct { color: #991b1b; }
  .resumen-auditoria.rojo p { color: #991b1b; }

  /* ── Progress bar ────────────────────────────────────────── */
  .progress-wrap { background: var(--gris-borde); border-radius: 20px; height: 8px; margin-top: 6px; }
  .progress-bar  { height: 100%; border-radius: 20px; transition: width .6s ease; }

  /* ── Animaciones ─────────────────────────────────────────── */
  @keyframes spin    { to { transform: rotate(360deg); } }
  @keyframes fadeIn  { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }

  /* ── Matriz Semanal de Auditorías ("El Cuadrito" Cronograma) ───────── */
  .table-matriz-5s {
    width: 100%; border-collapse: collapse; font-family: 'Inter', system-ui, sans-serif;
  }
  .table-matriz-5s th {
    background: #00a2e8; color: #ffffff; font-weight: 700; font-size: 13px;
    padding: 10px 14px; text-align: left; border: 1px solid #70c4ec;
  }
  .table-matriz-5s td {
    padding: 9px 14px; font-size: 13px; border: 1px solid #e2e8f0;
    color: var(--texto); vertical-align: middle;
  }
  .table-matriz-5s tbody tr:nth-child(even) {
    background: #f8fafc;
  }
  .table-matriz-5s tbody tr:hover {
    background: #f1f5f9;
  }
  .badge-auditado {
    display: inline-block; padding: 4px 10px; border-radius: 6px;
    font-weight: 800; font-size: 12px; text-align: center; min-width: 56px;
  }
  .badge-auditado-verde {
    background: #dcfce7; color: #15803d; border: 1px solid #86efac;
  }
  .badge-auditado-amarillo {
    background: #fef3c7; color: #b45309; border: 1px solid #fde68a;
  }
  .badge-auditado-rojo {
    background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5;
  }

  /* ── Estilos del Mapa Interactivo de Territorios 5S ───────── */
  #vista-mapa {
    max-width: 1360px;
    margin: 0 auto;
    padding: 14px 16px;
  }
  .mapa-dashboard-grid {
    display: grid;
    grid-template-columns: 185px 1fr;
    background: var(--mapa-card-bg);
    min-height: 580px;
    transition: background .2s;
  }
  .mapa-sidebar-lateral {
    background: var(--mapa-sidebar-bg);
    border-right: 1px solid var(--gris-borde);
    padding: 10px 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
    max-height: 660px;
    transition: background .2s, border-color .2s;
  }
  .mapa-zona-card {
    background: var(--mapa-card-bg);
    border: 1px solid var(--gris-borde);
    border-radius: var(--radius-sm);
    padding: 6px 6px;
    text-align: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
    cursor: pointer;
    transition: all .2s ease;
  }
  .mapa-zona-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
    border-color: var(--azul);
  }
  .mapa-zona-titulo {
    font-size: 11px;
    font-weight: 800;
    color: var(--texto);
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mapa-zona-img-wrap {
    background: rgba(0, 32, 96, 0.05);
    border-radius: 4px;
    padding: 3px 2px;
    margin-bottom: 4px;
  }
  [data-theme="dark"] .mapa-zona-img-wrap {
    background: rgba(255, 255, 255, 0.06);
  }
  .mapa-zona-icon {
    font-size: 15px;
    line-height: 1;
  }
  .mapa-zona-sub {
    font-size: 9.5px;
    color: var(--texto-muted);
    font-weight: 600;
  }

  .mapa-blueprint-wrapper {
    position: relative;
    background: var(--mapa-sidebar-bg);
    overflow: hidden;
    padding: 12px 14px;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    min-height: 580px;
    transition: background .2s;
  }
  .mapa-blueprint-inner {
    position: relative;
    width: 100%;
    max-width: 1140px;
    max-height: 650px;
    aspect-ratio: 960 / 625;
    background-size: 100% 100%;
    background-repeat: no-repeat;
    background-position: center;
    border: 1.5px solid var(--gris-borde);
    border-radius: 8px;
    box-shadow: 0 4px 24px rgba(0,0,0,.09);
  }

  /* Pines superpuestos sobre el plano con diseño de tarjeta de referencia */
  .map-pin {
    position: absolute;
    transform: translate(-50%, -50%);
    background: var(--mapa-pin-bg);
    border: 1.5px solid #d97706; /* Borde ámbar/dorado de la imagen de referencia */
    border-radius: 6px;
    padding: 4px 6px;
    box-shadow: 0 4px 14px rgba(0,0,0,.18);
    cursor: pointer;
    transition: all .2s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 10;
    text-align: center;
    min-width: 84px;
    backdrop-filter: blur(4px);
  }
  .map-pin:hover {
    transform: translate(-50%, -50%) scale(1.18);
    z-index: 50;
    border-color: #0284c7;
    box-shadow: 0 8px 24px rgba(2, 132, 199, 0.35);
  }
  .map-pin-tag {
    font-size: 10px;
    font-weight: 800;
    color: var(--texto);
    margin-bottom: 2px;
    white-space: nowrap;
    line-height: 1.2;
  }
  .map-pin-dueno-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 2px;
  }
  .map-pin-dueno {
    font-size: 8.5px;
    color: #38bdf8;
    font-weight: 700;
    max-width: 88px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    line-height: 1.2;
  }
  [data-theme="light"] .map-pin-dueno {
    color: #0369a1;
  }
  .map-pin-foto {
    width: 54px;
    height: 35px;
    border-radius: 3px;
    object-fit: cover;
    border: 1px solid var(--gris-borde);
    margin: 2px auto;
    display: block;
  }
  .mapa-zona-dueno-wrap {
    margin: 2px 0 3px 0;
  }
  .mapa-zona-dueno {
    font-size: 9px;
    font-weight: 700;
    color: #0284c7;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .map-badge {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 900;
    font-size: 11px;
    letter-spacing: .2px;
    line-height: 1.2;
    box-shadow: 0 2px 6px rgba(0,0,0,.2);
  }
  .map-badge-verde {
    background: #10b981;
    color: #ffffff;
    box-shadow: 0 2px 6px rgba(16, 185, 129, .35);
  }
  .map-badge-amarillo {
    background: #f59e0b;
    color: #ffffff;
    box-shadow: 0 2px 6px rgba(245, 158, 11, .35);
  }
  .map-badge-rojo {
    background: #ef4444;
    color: #ffffff;
    box-shadow: 0 2px 6px rgba(239, 68, 68, .35);
  }

  /* ── Estilos Modo TV (Kiosko Pantalla Completa) ───────────── */
  .btn-salir-tv {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #ef4444;
    color: #ffffff;
    border: none;
    border-radius: 50px;
    padding: 12px 22px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    z-index: 100000;
    box-shadow: 0 6px 20px rgba(239,68,68,0.5);
    display: none;
    align-items: center;
    gap: 8px;
    transition: all .2s;
  }
  .btn-salir-tv:hover {
    background: #dc2626;
    transform: scale(1.05);
  }

  body.en-modo-tv {
    overflow: hidden !important;
    background: #0f172a !important;
    margin: 0 !important;
    padding: 0 !important;
  }
  body.en-modo-tv .header-app,
  body.en-modo-tv .nav-tabs-5s,
  body.en-modo-tv .notificacion-banner,
  body.en-modo-tv .filtros-card,
  body.en-modo-tv #vista-dashboard,
  body.en-modo-tv #vista-subir,
  body.en-modo-tv #vista-baul,
  body.en-modo-tv #vista-auditoria,
  body.en-modo-tv #vista-hallazgos {
    display: none !important;
  }
